<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Career Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600/10 border border-blue-500/20 text-blue-400 rounded-2xl mb-3">
                <i class="fa-solid fa-right-to-bracket text-xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Welcome Back</h2>
            <p class="text-xs text-slate-400 mt-1">Select your role and sign in</p>
        </div>

        <!-- Role Toggle -->
        <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-950 rounded-2xl border border-slate-800">
            <button id="btn-cand" type="button" onclick="selectRole('candidate')" class="py-2.5 text-xs font-bold rounded-xl bg-blue-600 text-white shadow-md transition-all">
                <i class="fa-solid fa-user-graduate mr-1.5"></i> Candidate
            </button>
            <button id="btn-rec" type="button" onclick="selectRole('recruiter')" class="py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-briefcase mr-1.5"></i> Recruiter
            </button>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="name@domain.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20 mt-2">
                Log In as Candidate
            </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800">
            Don't have an account? 
            <a href="/signup" class="text-blue-400 font-bold hover:underline">Create Account</a>
        </div>
    </div>

    <script>
        let currentRole = 'candidate';

        function selectRole(role) {
            currentRole = role;
            const candBtn = document.getElementById('btn-cand');
            const recBtn = document.getElementById('btn-rec');
            const submitBtn = document.getElementById('submit-btn');

            if (role === 'candidate') {
                candBtn.className = "py-2.5 text-xs font-bold rounded-xl bg-blue-600 text-white shadow-md transition-all";
                recBtn.className = "py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all";
                submitBtn.innerText = "Log In as Candidate";
            } else {
                recBtn.className = "py-2.5 text-xs font-bold rounded-xl bg-blue-600 text-white shadow-md transition-all";
                candBtn.className = "py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all";
                submitBtn.innerText = "Log In as Recruiter";
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: currentRole })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert('⚠️ Error: ' + (data.detail || 'Login failed'));
                    return;
                }

                // Save session in browser
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard';

            } catch (err) {
                alert('⚠️ Server Connection Error');
            }
        }
    </script>
</body>
</html>
