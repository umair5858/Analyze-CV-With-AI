<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Hub | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="relative w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-5">
        <div class="text-center space-y-1">
            <h2 class="text-2xl font-black">Create Account</h2>
            <p class="text-xs text-slate-400">Join Career Hub Portal</p>
        </div>

        <div id="alert-box" class="hidden p-3 rounded-2xl text-xs font-semibold border"></div>

        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-2xl border border-slate-800">
            <button id="btn-cand" type="button" onclick="selectRole('candidate')" class="py-2 text-xs font-bold rounded-xl bg-blue-600 text-white">Candidate</button>
            <button id="btn-rec" type="button" onclick="selectRole('recruiter')" class="py-2 text-xs font-bold rounded-xl text-slate-400">Recruiter</button>
        </div>

        <form onsubmit="handleSignup(event)" class="space-y-3">
            <input type="text" id="fullname" required placeholder="Full Name" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs">
            <input type="email" id="email" required placeholder="Email Address" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs">
            <input type="password" id="password" required placeholder="Password" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs">
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-xs mt-2">Register Account</button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-3 border-t border-slate-800">
            Already registered? <a href="/login" class="text-blue-400 font-bold">Log In</a>
        </div>
    </div>

    <script>
        let currentRole = 'candidate';

        function selectRole(role) {
            currentRole = role;
            document.getElementById('btn-cand').className = role === 'candidate' ? "py-2 text-xs font-bold rounded-xl bg-blue-600 text-white" : "py-2 text-xs font-bold rounded-xl text-slate-400";
            document.getElementById('btn-rec').className = role === 'recruiter' ? "py-2 text-xs font-bold rounded-xl bg-blue-600 text-white" : "py-2 text-xs font-bold rounded-xl text-slate-400";
        }

        async function handleSignup(e) {
            e.preventDefault();
            const full_name = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ full_name, email, password, role: currentRole })
            });
            const data = await res.json();

            if (res.ok) {
                alert('✅ Account created! Please Log In.');
                window.location.href = '/login';
            } else {
                alert('⚠️ ' + data.detail);
            }
        }
    </script>
</body>
</html>
